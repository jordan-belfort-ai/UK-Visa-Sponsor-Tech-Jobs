name: update list
on:
  schedule:
    - cron: "59 5 * * *"   # after the 04:15 UTC index build
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -P scripts/visa_jobs_list.py --out . --site https://jordan-belfort-ai.github.io/UK-Visa-Sponsor-Tech-Jobs/
      - run: |
          git config user.name "jordan-belfort-ai"
          git config user.email "jordan-belfort-ai@users.noreply.github.com"
          git add README.md jobs.json index.html
          git diff --cached --quiet || git commit -m "Update list $(date -u +%F)"
          git push
